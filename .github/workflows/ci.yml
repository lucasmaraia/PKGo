name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: End-to-end tests (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
