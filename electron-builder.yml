appId: io.github.lucasmaraia.pkgo
productName: PKGo
copyright: Copyright © 2026 lucasmaraia and contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/icon.png
  - package.json
  - '!**/*.map'
extraResources:
  # Payloads sent to the PS4 stay outside the asar archive as plain files.
  - from: resources/payloads
    to: payloads
asarUnpack: []
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
linux:
  icon: resources/icon.png
  category: Utility
  synopsis: Install PS4 packages over the network with GoldHEN
  maintainer: lucasmaraia
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${name}-${version}-${arch}.${ext}
publish: null
